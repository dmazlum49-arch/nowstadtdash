# Base44 sandbox environment for the Nowstadt dashboard (Laravel 10).
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# The app runs from the cloned source (repo bind-mounted, dependencies installed
# at container start), so edits are picked up without rebuilding the image.
# The user-facing entry point is host port 3000.
name: nowstadtdash

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults # dev placeholders — lowest precedence
      - /run/base44/app.env # platform-supplied secrets — always wins
    environment:
      - BASE44_PREVIEW_MODE
      # Sandbox only: the uploaded repo ships no composer.lock, so dependencies
      # must be resolved fresh, and Composer 2.10 refuses every Laravel 10 release
      # ("affected by security advisories"). Restoring the project's composer.lock
      # is the real fix; until then this lets the dev environment install.
      - COMPOSER_NO_BLOCKING=1
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nowstadtdash
      - DB_USERNAME=nowstadt
      - DB_PASSWORD=nowstadt
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        # The uploaded repository has no application code, so there is nothing
        # to serve yet. Wait for it (instead of exiting, which would restart-
        # loop the container) and start the app automatically once it appears.
        while [ ! -f public/index.php ] || [ ! -d app ]; do
          echo "Application source missing: app/ and public/index.php were never uploaded, so there is no entry point to serve yet — waiting for them." >&2
          sleep 15
        done
        # Laravel needs these writable directories; the repo does not ship them.
        mkdir -p storage/framework/cache storage/framework/sessions \
                 storage/framework/views storage/app/public storage/logs \
                 bootstrap/cache
        composer install --no-interaction --prefer-dist --no-progress
        exec php artisan serve --host=0.0.0.0 --port=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "Nowstadt Dashboard"
      base44.kind: web
      base44.port: "3000"

  mysql:
    image: mysql:8
    environment:
      - MYSQL_DATABASE=nowstadtdash
      - MYSQL_USER=nowstadt
      - MYSQL_PASSWORD=nowstadt
      - MYSQL_ROOT_PASSWORD=nowstadt_root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: on-failure

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

volumes:
  mysql-data:
